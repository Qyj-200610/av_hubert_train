# @package _group_
#
# LRS2 小规模冒烟测试配置（smoke test）
# 目的：用极少的更新步数把「数据加载 → 前向 → 反向 → 验证 → 解码」整条链路跑通，
#       确认环境与数据没有问题后，再换成 base_lrs2_video_only.yaml 正式微调。
#
# 用法：
#   python fairseq_cli/hydra_train.py -m --config-dir avhubert/conf --config-name finetune/smoke_lrs2 \
#     common.user_dir=$(pwd) task.data=$DATA task.label_dir=$DATA \
#     task.tokenizer_bpe_model=$DATA/spm1000/spm_unigram1000.model \
#     model.w2v_path=$CKPT hydra.run.dir=$EXP/smoke

common:
  fp16: true
  log_format: json
  log_interval: 5
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  save_interval: 1
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 1     # 单卡跑冒烟测试
  distributed_port: 29671
  nprocs_per_node: 1

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: ???
  normalize: true
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  modalities: ["video"]
  image_aug: false              # 冒烟测试关掉增广，便于对比
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 2
  max_tokens: 400               # 小 batch，省显存
  validate_after_updates: 0
  validate_interval: 1
  train_subset: train
  valid_subset: valid

criterion:
  _name: label_smoothed_cross_entropy
  report_accuracy: true
  label_smoothing: 0.1

optimization:
  max_update: 20                # ★ 只跑 20 步
  lr: [0.001]
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 10
  hold_steps: 0
  decay_steps: 10
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  decoder_layers: 9
  decoder_dropout: 0.1
  decoder_attention_dropout: 0.0
  decoder_activation_dropout: 0.1
  freeze_finetune_updates: 0    # ★ 冒烟测试不冻结，确保编码器真的参与反传
  share_decoder_input_output_embed: true
  decoder_normalize_before: true
  decoder_embed_dim: 1024
  decoder_ffn_embed_dim: 4096
  decoder_attention_heads: 8

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
