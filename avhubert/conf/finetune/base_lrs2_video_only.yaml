# @package _group_
#
# AV-HuBERT 在 LRS2(main) 上微调 —— 基座模型(base) + 纯视觉(video-only)
# 对应官方 avhubert/conf/finetune/base_vox_433h.yaml，改动如下：
#   * 新增逐层参数说明与 LRS2 相关注释，便于复现
#   * max_update / warmup 等超参沿用官方 LRS3-433h 设置（LRS2 main 约 100+ 小时，
#     与此量级接近），如算力紧张可下调
#
# 关键：本配置只做 **纯视觉唇读**，故 task.modalities 只有 "video"。
#       （论文 LRS2 上 video-only 的测试结果即由这一类配置得到）

common:
  fp16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???          # 启动时传 common.user_dir=$(pwd)，即 av_hubert 仓库根目录

checkpoint:
  save_interval: 2       # 每 2 个 epoch 存一次
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  # 单卡时在命令行覆盖：distributed_training.distributed_world_size=1
  distributed_world_size: 8
  distributed_port: 29671
  nprocs_per_node: 8

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???                        # <work_dir>/data
  label_dir: ???                   # 通常与 data 相同
  tokenizer_bpe_model: ???         # <work_dir>/spm1000/spm_unigram1000.model
  normalize: true                  # 必须与预训练一致（预训练配置里 normalize: true）
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  modalities: ["video"]            # ★ 仅视觉模态
  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 1000
  validate_after_updates: 0
  validate_interval: 2
  train_subset: train
  valid_subset: valid              # 对应 valid.tsv（LRS2 的 val 划分）

criterion:
  _name: label_smoothed_cross_entropy
  report_accuracy: true
  label_smoothing: 0.1

optimization:
  max_update: 30000
  lr: [0.001]
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 10000
  hold_steps: 0
  decay_steps: 20000
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???                    # 预训练权重，例如 pretrained/base_vox_iter4.pt
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  decoder_layers: 9
  decoder_dropout: 0.1
  decoder_attention_dropout: 0.0
  decoder_activation_dropout: 0.1
  freeze_finetune_updates: 30000
  share_decoder_input_output_embed: true
  decoder_normalize_before: true
  decoder_embed_dim: 1024
  decoder_ffn_embed_dim: 4096
  decoder_attention_heads: 8

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
          - criterion.wer_kenlm_model
          - criterion.wer_lexicon
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
