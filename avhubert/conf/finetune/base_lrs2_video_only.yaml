# @package _global_
#
# 注意：必须是 _global_。Hydra ≥1.1 中 `_group_` 指"配置所在分组目录"，
# 本文件在 avhubert/conf/finetune/ 下，用 _group_ 会把所有键挂到 finetune.*，
# 导致 common.user_dir / task.data 等命令行覆盖报
# "Could not override ... Key 'common' is not in struct"。
#
# AV-HuBERT 在 LRS2(main) 上微调 —— 基座模型(base) + 纯视觉(video-only)
# 对应官方 avhubert/conf/finetune/base_vox_433h.yaml，只改数据路径与注释。
#
# ⚠ 修复记录（重要，原文件是跑不起来的）
# -----------------------------------------------------------------------------
# 原文件其实是从 **large_vox_433h.yaml** 抄来的（max_update 30000 / warmup 10000 /
# decay 20000 / decoder_layers 9 / decoder_embed_dim 1024 / ffn 4096 / heads 8），
# 而本项目用的是 **base** 权重（编码器 12 层 × 768 维，已用 state_dict 核对）。
# 后果不是"慢一点"，而是**第一次前向就崩**：
#   decoder_embed_dim=1024 时，解码器 cross-attention 的 k_proj 会被建成
#   Linear(1024,1024)，而编码器 memory 只有 768 维 ——
#   fairseq/modules/transformer_layer.py:263 用
#   `kdim=getattr(args,"encoder_embed_dim",None)` 取值，而 AVHubertSeq2SeqConfig
#   里**根本没有 encoder_embed_dim 这个字段**（hubert_asr.py 里 0 处），
#   于是 None → multihead_attention.py:43-44 回退成 kdim=embed_dim=1024。
# 实测（本机 base 权重断言复现）：
#   RuntimeError: mat1 and mat2 shapes cannot be multiplied (204x768 and 1024x1024)
#
# 修法：解码器尺寸回归官方 base 默认值（768 / 3072 / 6 层 / 4 头），
# 也就是把 large 的那几行覆盖去掉——这正是 base_vox_433h.yaml 的做法
# （它只显式写了 decoder_layers: 6，其余走 AVHubertSeq2SeqConfig 的默认值）。
# 同时调度也回到官方 base：max_update 45000 / warmup 15000 / decay 30000，
# 且 freeze_finetune_updates = 22500 = **一半**（官方是前半冻结、后半解冻；
# 原文件写的 30000 = max_update，等于编码器全程冻结，那是 large 的配法）。
#
# 关键：本配置只做 **纯视觉唇读**，故 task.modalities 只有 "video"。
#       （论文 LRS2 上 video-only 的测试结果即由这一类配置得到）

common:
  fp16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???          # 启动时传 common.user_dir=$(pwd)，即 av_hubert 仓库根目录

checkpoint:
  save_interval: 2       # 每 2 个 epoch 存一次
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  # 单卡时在命令行覆盖：distributed_training.distributed_world_size=1
  distributed_world_size: 8
  distributed_port: 29671
  nprocs_per_node: 8

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???                        # <work_dir>/data
  label_dir: ???                   # 通常与 data 相同
  tokenizer_bpe_model: ???         # <work_dir>/spm1000/spm_unigram1000.model
  normalize: true                  # 必须与预训练一致（预训练配置里 normalize: true）
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  modalities: ["video"]            # ★ 仅视觉模态
  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 1000
  validate_after_updates: 0
  validate_interval: 2
  train_subset: train
  valid_subset: valid              # 对应 valid.tsv（LRS2 的 val 划分）

criterion:
  _name: label_smoothed_cross_entropy
  report_accuracy: true
  label_smoothing: 0.1

optimization:
  max_update: 45000                # 官方 base_vox_433h.yaml:57
  lr: [0.001]
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 15000              # 官方 base_vox_433h.yaml:69
  hold_steps: 0
  decay_steps: 30000               # 官方 base_vox_433h.yaml:71
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???                    # 预训练权重，例如 pretrained/base_vox_iter4.pt
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  # ---- 解码器尺寸 = 官方 base 默认值（AVHubertSeq2SeqConfig）----
  # 这里**不要**写 decoder_embed_dim: 1024 / ffn 4096 / heads 8：
  # 那是 large 的尺寸，配 base 编码器（768 维）会让 cross-attention 的 k_proj
  # 变成 1024x1024 而编码器 memory 是 768，第一次前向就
  #   RuntimeError: mat1 and mat2 shapes cannot be multiplied (204x768 and 1024x1024)
  # 原因见本文件顶部的修复记录。
  decoder_layers: 6                # 官方 base_vox_433h.yaml:91 也是 6
  decoder_dropout: 0.1
  decoder_attention_dropout: 0.0
  decoder_activation_dropout: 0.1
  freeze_finetune_updates: 22500   # 官方 base_vox_433h.yaml:95 = max_update 的一半
                                   # （前半冻结编码器、后半解冻；原文件写 30000 是 large 的配法）
  share_decoder_input_output_embed: true
  decoder_normalize_before: true

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
          - criterion.wer_kenlm_model
          - criterion.wer_lexicon
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
